<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>客服统计看板 - 安吉尔 6.12-6.14</title>
<style>
:root {
  --bg: #f3f6fa;
  --panel: #ffffff;
  --panel-soft: #f8fafc;
  --ink: #1f2937;
  --muted: #64748b;
  --line: #dde4ee;
  --line-soft: #edf2f7;
  --blue: #2563eb;
  --blue-soft: #eaf2ff;
  --green: #15803d;
  --green-soft: #e8f7ee;
  --red: #b42318;
  --red-soft: #fee8e5;
  --amber: #b45309;
  --amber-soft: #fff4d8;
  --shadow: 0 8px 24px rgba(15, 23, 42, .06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; background: linear-gradient(180deg, #f7f9fc 0, var(--bg) 260px); color: var(--ink); }
.container { max-width: 1480px; margin: 0 auto; padding: 20px; }
.header { background: #182230; color: #fff; border: 1px solid rgba(255,255,255,.08); border-radius: 8px; padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; box-shadow: var(--shadow); }
.header h1 { font-size: 24px; font-weight: 700; letter-spacing: 0; }
.header p { font-size: 13px; color: #d6deea; margin-top: 6px; }
.header-meta { text-align: right; font-size: 12px; color: #d6deea; line-height: 1.8; }
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin: 16px 0; background: rgba(255,255,255,.92); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; box-shadow: 0 4px 16px rgba(15,23,42,.04); }
.date-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.date-tab { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 8px 15px; cursor: pointer; font-size: 13px; color: #334155; transition: background .16s, color .16s, border-color .16s, box-shadow .16s; }
.date-tab:hover { border-color: #9bb7df; background: #f7fbff; }
.date-tab.active { background: var(--blue); border-color: var(--blue); color: #fff; box-shadow: 0 6px 14px rgba(37,99,235,.22); }
.scope { font-size: 13px; color: var(--muted); }
.scope strong { color: var(--ink); }
.section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 18px; margin-bottom: 16px; box-shadow: var(--shadow); }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; border-bottom: 1px solid var(--line-soft); padding-bottom: 12px; }
.section-title h2 { font-size: 18px; color: #111827; }
.section-title span { font-size: 12px; color: var(--muted); }
.overview-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(360px, .85fr); gap: 14px; align-items: stretch; }
.kpi-grid { display: grid; grid-template-columns: repeat(3, minmax(150px, 1fr)); gap: 12px; }
.kpi-card { min-height: 106px; border: 1px solid var(--line); border-radius: 8px; padding: 15px; background: linear-gradient(180deg, #fff 0, #fbfdff 100%); position: relative; overflow: hidden; }
.kpi-card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: #8aa4c2; }
.kpi-card.success::before { background: var(--green); }
.kpi-card.danger::before { background: #e95f3f; }
.kpi-card .label { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.kpi-card .value { font-size: 27px; font-weight: 760; color: #111827; line-height: 1.05; }
.kpi-card .sub { font-size: 11px; color: #8090a4; margin-top: 8px; }
.kpi-card.success .value { color: var(--green); }
.kpi-card.danger .value { color: #c2410c; }
.trend-panel { border: 1px solid var(--line); border-radius: 8px; padding: 14px; background: var(--panel-soft); }
.trend-panel h3 { font-size: 14px; margin-bottom: 11px; color: #334155; }
.trend-row { width: 100%; display: grid; grid-template-columns: 48px 1fr 70px 130px; gap: 10px; align-items: center; border: 1px solid transparent; background: transparent; padding: 9px 10px; border-radius: 7px; cursor: pointer; text-align: left; transition: background .16s, border-color .16s; }
.trend-row:hover, .trend-row.active { background: #fff; border-color: #cfe0f7; }
.trend-bar { height: 10px; background: #e4eaf2; border-radius: 20px; overflow: hidden; }
.trend-bar i { display: block; height: 100%; border-radius: inherit; }
.trend-bar .good { background: var(--green); }
.trend-bar .bad { background: #ea580c; }
.trend-bar .muted { background: #94a3b8; }
.trend-row strong { font-size: 13px; }
.trend-row em { font-style: normal; font-size: 12px; color: #64748b; }
.ranking-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
thead { position: sticky; top: 0; z-index: 2; }
th { text-align: left; background: #f6f8fb; color: #475569; padding: 11px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; cursor: pointer; font-weight: 650; }
th.sorted { color: #1d4ed8; background: #eef6ff; }
td { padding: 11px 10px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; vertical-align: top; }
.rank-row { cursor: pointer; }
.rank-row:hover td { background: #fbfdff; }
.rank-row.selected td { background: #f0f7ff; }
.rank-row.selected td:first-child { box-shadow: inset 3px 0 0 var(--blue); }
.detail-link { margin-left: 8px; border: 1px solid #c7d4e5; background: #fff; border-radius: 5px; padding: 3px 8px; color: #475569; cursor: pointer; font-size: 12px; transition: border-color .16s, background .16s; }
.detail-link:hover { background: #f7fbff; border-color: #8db2e8; }
.field-row td { background: #fbfdff; white-space: normal; }
.field-detail { display: grid; grid-template-columns: repeat(2, minmax(280px, 1fr)); gap: 12px; }
.field-group { border: 1px solid var(--line); border-radius: 8px; padding: 13px; background: #fff; }
.field-group h4 { font-size: 13px; margin-bottom: 9px; color: #334155; }
.field-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; }
.field-item { border-bottom: 1px dashed #dfe7f1; padding-bottom: 6px; }
.field-item span { display: block; color: var(--muted); font-size: 11px; }
.field-item strong { display: block; color: #111827; font-size: 12px; margin-top: 2px; word-break: break-all; }
.badge { display: inline-block; border-radius: 999px; padding: 2px 8px; font-size: 11px; font-weight: 650; }
.badge.danger { color: var(--red); background: var(--red-soft); }
.badge.warning { color: var(--amber); background: var(--amber-soft); }
.badge.success { color: var(--green); background: var(--green-soft); }
.badge.muted { color: #475569; background: #e7edf4; }
.badge.info { color: #175cd3; background: var(--blue-soft); }
.rule-note { margin-top: 4px; color: #94a3b8; font-size: 11px; }
.text-danger { color: #b42318; font-weight: 650; }
.text-success { color: #067647; font-weight: 650; }
.complaint-summary { font-size: 13px; color: #475569; margin-bottom: 10px; }
.complaint-card { border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin-bottom: 12px; background: #fff; box-shadow: 0 4px 14px rgba(15,23,42,.04); }
.complaint-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.complaint-head strong { color: #b42318; margin-right: 8px; }
.complaint-head span, .complaint-meta span { font-size: 12px; color: #64748b; }
.complaint-meta { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
.product-name { margin: 8px 0; color: #334155; font-size: 13px; white-space: normal; }
.evidence-btn { border: 1px solid #b8cef2; background: #eff6ff; color: #1d4ed8; border-radius: 6px; padding: 7px 11px; cursor: pointer; font-size: 13px; margin: 7px 0 10px; }
.evidence-btn:hover { border-color: #7da7e9; background: #e5f0ff; }
.session-block { display: none; border-top: 1px solid var(--line-soft); padding-top: 10px; margin-top: 8px; }
.session-block.open { display: block; }
.session-meta, .related-title { font-size: 12px; color: #64748b; margin-bottom: 8px; }
.chat-list { max-height: 520px; overflow-y: auto; padding-right: 6px; }
.chat-msg { max-width: 86%; margin: 8px 0; padding: 9px 11px; border-radius: 8px; white-space: normal; word-break: break-word; line-height: 1.55; font-size: 13px; }
.chat-msg.agent { background: #eef6ff; margin-right: auto; border: 1px solid #d6e8ff; }
.chat-msg.customer { background: #fbfcfe; margin-left: auto; border: 1px solid #e5eaf2; }
.msg-meta { display: flex; justify-content: space-between; gap: 12px; font-size: 11px; color: #64748b; margin-bottom: 4px; }
.msg-content a { color: #1d4ed8; }
.media-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.media-card { border: 1px solid #d9e2ec; border-radius: 8px; overflow: hidden; background: #fff; width: min(320px, 100%); }
.media-label { display: flex; justify-content: space-between; padding: 6px 9px; font-size: 12px; color: #475569; background: #f8fafc; }
.media-card img, .media-card video { display: block; width: 100%; max-height: 260px; object-fit: contain; background: #0f172a; }
.media-actions { padding: 7px 9px; font-size: 12px; }
.media-actions a { color: #1d4ed8; }
.media-fallback { display: grid; gap: 6px; padding: 18px; color: #64748b; background: #f8fafc; font-size: 12px; }
.lightbox-overlay { display: none; position: fixed; inset: 0; z-index: 1000; background: rgba(15, 23, 42, .88); align-items: center; justify-content: center; padding: 28px; }
.lightbox-overlay.show { display: flex; }
.lightbox-overlay img { max-width: 92vw; max-height: 88vh; border-radius: 8px; }
.lightbox-overlay button { position: fixed; right: 24px; top: 20px; border: 0; border-radius: 6px; padding: 8px 12px; cursor: pointer; }
.empty { text-align: center; color: #94a3b8; padding: 34px 12px; }
.empty.small { padding: 12px; background: #f8fafc; border-radius: 6px; }
.split-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; margin-bottom: 16px; }
.split-layout > .section { margin-bottom: 0; }
#complaint-section { max-height: 75vh; overflow-y: auto; position: sticky; top: 10px; }
.pagination { display: flex; align-items: center; gap: 6px; padding: 12px 0 4px; flex-wrap: wrap; }
.page-btn { border: 1px solid var(--line); background: #fff; border-radius: 5px; padding: 6px 12px; cursor: pointer; font-size: 12px; color: #334155; transition: background .16s, border-color .16s; }
.page-btn:hover:not(:disabled) { border-color: var(--blue); background: var(--blue-soft); }
.page-btn.active { background: var(--blue); border-color: var(--blue); color: #fff; }
.page-btn:disabled { opacity: .4; cursor: default; }
.page-ellipsis { padding: 0 4px; color: var(--muted); font-size: 12px; }
.page-info { margin-left: 8px; font-size: 12px; color: var(--muted); }
@media (max-width: 980px) {
  .header, .toolbar, .complaint-head { flex-direction: column; align-items: flex-start; }
  .header-meta { text-align: left; }
  .overview-grid, .field-detail { grid-template-columns: 1fr; }
  .kpi-grid { grid-template-columns: repeat(2, minmax(140px, 1fr)); }
  .trend-row { grid-template-columns: 48px 1fr 64px; }
  .trend-row em { grid-column: 2 / 4; }
  .split-layout { grid-template-columns: 1fr; }
  #complaint-section { max-height: none; overflow-y: visible; position: static; }
}
</style>
</head>

<div class="container">
  <header class="header">
    <div>
      <h1>客服统计看板</h1>
      <p>安吉尔客服数据 6.12-6.14｜目标：10 秒看懂整体、波动、复盘对象和聊天证据</p>
    </div>
    <div class="header-meta">
      <div>生成日期：<span id="generatedAt"></span></div>
      <div>满意率口径：好评量 / 评价量加权</div>
    </div>
  </header>

  <div class="toolbar">
    <div class="date-tabs" id="date-tabs"></div>
    <div class="scope">当前查看：<strong id="scopeText">全部</strong></div>
  </div>

  <section class="section" id="overview-section">
    <div class="section-title">
      <h2>总览统计</h2>
      <span>首屏仅保留核心 KPI 和每日满意率趋势</span>
    </div>
    <div class="overview-grid">
      <div class="kpi-grid" id="kpi-cards">
        <div class="kpi-card"><div class="label">总咨询量</div><div class="value">-</div></div>
        <div class="kpi-card"><div class="label">总评价量</div><div class="value">-</div></div>
        <div class="kpi-card"><div class="label">好评量</div><div class="value">-</div></div>
        <div class="kpi-card"><div class="label">差评量</div><div class="value">-</div></div>
        <div class="kpi-card"><div class="label">整体满意率</div><div class="value">-</div></div>
        <div class="kpi-card"><div class="label">异常客服人次</div><div class="value">-</div></div>
      </div>
      <div class="trend-panel">
        <h3>每日满意率趋势</h3>
        <div id="trend-chart"></div>
      </div>
    </div>
  </section>

  <div class="split-layout">
  <section class="section" id="ranking-section">
    <div class="section-title">
      <h2>客服排行</h2>
      <span id="rankingCount">0 条</span>
    </div>
    <div class="ranking-wrap">
      <table id="agent-ranking">
        <thead>
          <tr>
            <th data-sort="date">日期</th>
            <th data-sort="agent">客服</th>
            <th data-sort="satisfaction" onclick="sortRanking('satisfaction')">满意率 <span class="sort-mark"></span></th>
            <th data-sort="bad" onclick="sortRanking('bad')">差评量 <span class="sort-mark"></span></th>
            <th data-sort="eval" onclick="sortRanking('eval')">评价量 <span class="sort-mark"></span></th>
            <th data-sort="consult" onclick="sortRanking('consult')">咨询量 <span class="sort-mark"></span></th>
            <th data-sort="response" onclick="sortRanking('response')">响应时长 <span class="sort-mark"></span></th>
            <th data-sort="rule">复盘状态</th>
          </tr>
        </thead>
        <tbody id="agent-tbody"></tbody>
      </table>
    </div>
    <div id="pagination"></div>
  </section>

  <section class="section" id="complaint-section">
    <div class="section-title">
      <h2>差评明细</h2>
      <span>当前客服：<strong id="selectedAgentText">未选择客服</strong></span>
    </div>
    <div id="complaintPanel"></div>
  </section>
</div>
</div>

function dateKey(value) {

function num(value) {

}

function weightedSat(rows) {
  var evals = rows.reduce(function(sum, row) { return sum + num(row['评价量']); }, 0);
  var good = rows.reduce(function(sum, row) { return sum + num(row['好评量']); }, 0);
  return evals > 0 ? good / evals * 100 : null;
}

function classifyAgent(row) {
  var evalCount = num(row['评价量']);
  var good = num(row['好评量']);
  var bad = num(row['差评量']);
  var sat = evalCount > 0 ? good / evalCount * 100 : null;
  if (evalCount === 0) {
    return { label: '无评价', cls: 'muted', isAnomaly: false, priority: 0, reason: '评价量为0，不参与满意率异常' };
  }
  if (sat === 0 && evalCount < 3) {
    return { label: '低样本风险', cls: 'warning', isAnomaly: bad >= 2, priority: bad >= 2 ? 3 : 1, reason: '0%满意率但评价量小于3，不并入严重异常' };
  }
  if (bad >= 2) {
    return { label: '差评异常', cls: 'danger', isAnomaly: true, priority: 4, reason: '差评量≥2' };
  }
  if (sat < 90 && evalCount >= 3) {
    return { label: '满意率异常', cls: sat < 70 ? 'danger' : 'warning', isAnomaly: true, priority: sat < 70 ? 4 : 3, reason: '满意率低于90%且评价量≥3' };
  }
  return { label: '正常', cls: 'success', isAnomaly: false, priority: 0, reason: '未触发异常规则' };
}

function renderOverview() {
  var rows = filteredRows();
  var totalConsult = rows.reduce(function(sum, row) { return sum + num(row['咨询量']); }, 0);
  var totalEval = rows.reduce(function(sum, row) { return sum + num(row['评价量']); }, 0);
  var totalGood = rows.reduce(function(sum, row) { return sum + num(row['好评量']); }, 0);
  var totalBad = rows.reduce(function(sum, row) { return sum + num(row['差评量']); }, 0);
  var sat = totalEval > 0 ? totalGood / totalEval * 100 : null;
  var anomalyCount = rows.filter(function(row) { return classifyAgent(row).isAnomaly; }).length;
  var cards = [
    ['总咨询量', fmtInt(totalConsult), '当前日期范围'],
    ['总评价量', fmtInt(totalEval), '参与满意率加权'],
    ['好评量', fmtInt(totalGood), '来自原表汇总'],
    ['差评量', fmtInt(totalBad), '用于复盘优先级'],
    ['整体满意率', sat === null ? '无评价' : sat.toFixed(1) + '%', '好评量 / 评价量'],
    ['异常客服人次', fmtInt(anomalyCount), '按新版异常规则']
  ];
  document.getElementById('kpi-cards').innerHTML = cards.map(function(card) {
    var cls = card[0] === '差评量' || card[0] === '异常客服人次' ? 'danger' : card[0] === '整体满意率' ? (sat >= 90 ? 'success' : 'danger') : '';
    return '<div class="kpi-card '+cls+'"><div class="label">'+card[0]+'</div><div class="value">'+card[1]+'</div><div class="sub">'+card[2]+'</div></div>';
  }).join('');
  document.getElementById('scopeText').textContent = state.date === 'all' ? '6.12 - 6.14 汇总' : state.date + ' 单日';
}

function dailyStats(day) {
  var rows = (DATA.merged_table || []).filter(function(row) { return row._day === day; });
  var evals = rows.reduce(function(sum, row) { return sum + num(row['评价量']); }, 0);
  var good = rows.reduce(function(sum, row) { return sum + num(row['好评量']); }, 0);
  var bad = rows.reduce(function(sum, row) { return sum + num(row['差评量']); }, 0);
  var consult = rows.reduce(function(sum, row) { return sum + num(row['咨询量']); }, 0);
  var sat = evals > 0 ? good / evals * 100 : null;
  return { day: day, rows: rows.length, consult: consult, evals: evals, good: good, bad: bad, sat: sat };
}

function renderTrend() {
  var stats = allDays().map(dailyStats);
  var html = stats.map(function(item) {
    var width = item.sat === null ? 0 : Math.max(6, Math.min(100, item.sat));
    var cls = item.sat === null ? 'muted' : item.sat >= 90 ? 'good' : 'bad';
    var active = state.date === item.day ? ' active' : '';
    return '<button class="trend-row'+active+'" onclick="setDate(\''+item.day+'\')">'+
      '<span class="trend-day">'+item.day+'</span>'+
      '<span class="trend-bar"><i class="'+cls+'" style="width:'+width+'%"></i></span>'+
      '<strong>'+(item.sat === null ? '无评价' : item.sat.toFixed(1)+'%')+'</strong>'+
      '<em>评价 '+fmtInt(item.evals)+' / 差评 '+fmtInt(item.bad)+'</em>'+
    '</button>';
  }).join('');
  document.getElementById('trend-chart').innerHTML = html;
}

function sortRanking(key) {
  if (state.sortKey === key) state.sortAsc = !state.sortAsc;
  else {
    state.sortKey = key;
    state.sortAsc = key === 'satisfaction' || key === 'response';
  }
  state.page = 0;
  renderRanking();
}

function rankingRows() {
  var rows = filteredRows().slice();
  rows.sort(function(a, b) {
    var ca = classifyAgent(a);
    var cb = classifyAgent(b);
    var va;
    var vb;
    if (state.sortKey === 'satisfaction') {
      va = num(a['评价量']) > 0 ? num(a['好评量']) / num(a['评价量']) * 100 : 999;
      vb = num(b['评价量']) > 0 ? num(b['好评量']) / num(b['评价量']) * 100 : 999;
    } else if (state.sortKey === 'bad') {
      va = num(a['差评量']); vb = num(b['差评量']);
    } else if (state.sortKey === 'eval') {
      va = num(a['评价量']); vb = num(b['评价量']);
    } else if (state.sortKey === 'consult') {
      va = num(a['咨询量']); vb = num(b['咨询量']);
    } else if (state.sortKey === 'response') {
      va = num(a['平均响应时长']); vb = num(b['平均响应时长']);
    } else {
      va = ca.priority * 100000 + num(a['差评量']) * 1000 + num(a['评价量']);
      vb = cb.priority * 100000 + num(b['差评量']) * 1000 + num(b['评价量']);
    }
    if (va === vb) return String(a['客服']).localeCompare(String(b['客服']));
    return state.sortAsc ? va - vb : vb - va;
  });
  return rows;
}

function renderRanking() {
  var rows = rankingRows();
  var total = rows.length;
  var pageSize = state.pageSize;
  var pageCount = Math.max(1, Math.ceil(total / pageSize));
  if (state.page >= pageCount) state.page = pageCount - 1;
  if (state.page < 0) state.page = 0;
  var start = state.page * pageSize;
  var pageRows = rows.slice(start, start + pageSize);

  document.getElementById('rankingCount').textContent = total + ' 条';
  var html = pageRows.map(function(row) {
    var evalCount = num(row['评价量']);
    var sat = evalCount > 0 ? num(row['好评量']) / evalCount * 100 : null;
    var cls = classifyAgent(row);
    var selected = state.selectedAgent === row['客服'] ? ' selected' : '';
    var expanded = state.expandedAgent === row['客服'];
    var main = '<tr class="rank-row'+selected+'" onclick="selectAgent(\''+escJs(row['客服'])+'\')">'+
      '<td>'+escHtml(row._day || '')+'</td>'+
      '<td><strong>'+escHtml(row['客服'])+'</strong><button class="detail-link" onclick="toggleAgentFields(event, \''+escJs(row['客服'])+'\')">'+(expanded ? '收起字段' : '完整字段')+'</button></td>'+
      '<td class="'+(sat !== null && sat < 90 ? 'text-danger' : 'text-success')+'">'+(sat === null ? '无评价' : sat.toFixed(1)+'%')+'</td>'+
      '<td class="'+(num(row['差评量']) > 0 ? 'text-danger' : '')+'">'+fmtInt(row['差评量'])+'</td>'+
      '<td>'+fmtInt(row['评价量'])+'</td>'+
      '<td>'+fmtInt(row['咨询量'])+'</td>'+
      '<td>'+displayValue(row['平均响应时长'], 's')+'</td>'+
      '<td><span class="badge '+cls.cls+'">'+cls.label+'</span><div class="rule-note">'+cls.reason+'</div></td>'+
    '</tr>';
    var detail = expanded ? '<tr class="field-row"><td colspan="8">'+renderAgentFields(row)+'</td></tr>' : '';
    return main + detail;
  }).join('');
  document.getElementById('agent-tbody').innerHTML = html || '<tr><td colspan="8" class="empty">当前日期无客服数据</td></tr>';
  renderPagination(total, pageCount);
  updateSortIndicators();
}

function renderPagination(total, pageCount) {
  var el = document.getElementById('pagination');
  if (pageCount <= 1) {
    el.innerHTML = '';
    return;
  }
  var page = state.page;
  var html = '<div class="pagination">';
  html += '<button class="page-btn" onclick="goPage('+(page-1)+')"'+(page <= 0 ? ' disabled' : '')+'>上一页</button>';
  var startPage = Math.max(0, Math.min(page - 2, pageCount - 5));
  var endPage = Math.min(pageCount, startPage + 5);
  if (startPage > 0) html += '<button class="page-btn" onclick="goPage(0)">1</button><span class="page-ellipsis">...</span>';
  for (var i = startPage; i < endPage; i++) {
    html += '<button class="page-btn'+(i === page ? ' active' : '')+'" onclick="goPage('+i+')">'+(i+1)+'</button>';
  }
  if (endPage < pageCount) html += '<span class="page-ellipsis">...</span><button class="page-btn" onclick="goPage('+(pageCount-1)+')">'+pageCount+'</button>';
  html += '<button class="page-btn" onclick="goPage('+(page+1)+')"'+(page >= pageCount-1 ? ' disabled' : '')+'>下一页</button>';
  html += '<span class="page-info">第 '+(page+1)+'/'+pageCount+' 页</span>';
  html += '</div>';
  el.innerHTML = html;
}

function goPage(n) {
  state.page = n;
  renderRanking();
}

function updateSortIndicators() {
  document.querySelectorAll('[data-sort]').forEach(function(th) {
    var active = th.dataset.sort === state.sortKey;
    th.classList.toggle('sorted', active);
    var mark = th.querySelector('.sort-mark');
    if (mark) mark.textContent = active ? (state.sortAsc ? '▲' : '▼') : '';
  });
}

function selectAgent(agent) {
  state.selectedAgent = agent;
  var rows = rankingRows();
  for (var i = 0; i < rows.length; i++) {
    if (rows[i]['客服'] === agent) {
      state.page = Math.floor(i / state.pageSize);
      break;
    }
  }
  renderRanking();
  renderComplaintDetail();
}

function toggleAgentFields(event, agent) {
  event.stopPropagation();
  state.expandedAgent = state.expandedAgent === agent ? null : agent;
  renderRanking();
}

function renderAgentFields(row) {
  function group(title, fields) {
    var items = fields.map(function(field) {
      return '<div class="field-item"><span>'+displayFieldLabel(field)+'</span><strong>'+displayValue(row[field])+'</strong></div>';
    }).join('');
    return '<div class="field-group"><h4>'+title+'</h4><div class="field-grid">'+items+'</div></div>';
  }
  return '<div class="field-detail">'+
    group('客服服务字段', coreFields)+
    group('转化营销字段', conversionFields)+
  '</div>';
}

function displayFieldLabel(field) {
  return fieldLabels[field] || field;
}

function renderComplaintDetail() {
  var panel = document.getElementById('complaintPanel');
  var agent = state.selectedAgent;
  var details = detailsForSelection(agent);
  document.getElementById('selectedAgentText').textContent = agent ? agent : '未选择客服';
  if (!agent) {
    panel.innerHTML = '<div class="empty">点击上方客服排行中的任意客服，下面会展开对应差评明细和聊天证据。</div>';
    return;
  }
  if (!details.length) {
    panel.innerHTML = '<div class="empty">当前日期下未找到该客服的差评/低满意度聊天证据。</div>';
    return;
  }
  panel.innerHTML = '<div class="complaint-summary">共 <strong>'+details.length+'</strong> 条差评或低满意度记录</div>' +
    details.map(renderComplaintCard).join('');
}

function renderComplaintCard(detail) {
  var lookup = (DATA.chat_lookup || {})[String(detail.idx)] || {};
  var session = lookup['当前会话'];
  var related = lookup['关联会话'] || [];
  var sessionId = 'session_' + detail.idx;
  var html = '<article class="complaint-card">'+
    '<div class="complaint-head">'+
      '<div><strong>'+escHtml(detail['满意度'] || '-')+'</strong><span>'+escHtml(detail['咨询时间'] || '-')+'</span></div>'+
      '<div><span class="badge info">'+escHtml(detail['问题归因_一级'] || '其他问题')+'</span>'+(detail['问题归因_二级'] ? '<span class="badge muted">'+escHtml(detail['问题归因_二级'])+'</span>' : '')+'</div>'+
    '</div>'+
    '<div class="complaint-meta">'+
      '<span>顾客：'+escHtml(detail['顾客'] || '-')+'</span>'+
      '<span>是否解决：'+escHtml(detail['是否解决'] || '-')+'</span>'+
      '<span>CID：'+escHtml(detail['cid'] || '-')+'</span>'+
    '</div>'+
    '<div class="product-name">'+escHtml(detail['商品名称'] || '-')+'</div>';
  if (session) {
    html += '<button class="evidence-btn" data-toggle-session="'+sessionId+'">展开/收起聊天证据</button>';
    html += '<div class="session-block" id="'+sessionId+'">'+renderChatSession(session)+'</div>';
  } else {
    html += '<div class="empty small">未匹配到聊天全文</div>';
  }
  if (related.length) {
    html += '<div class="related-title">关联会话 '+related.length+' 通</div>';
    related.forEach(function(item, index) {
      var relatedId = 'related_'+detail.idx+'_'+index;
      html += '<button class="evidence-btn" data-toggle-session="'+relatedId+'">展开/收起 关联 #'+(index+1)+'</button>';
      html += '<div class="session-block" id="'+relatedId+'"><div class="related-title">关联 #'+(index+1)+'</div>'+renderChatSession(item)+'</div>';
    });
  }
  html += '</article>';
  return html;
}

function renderChatSession(session) {
  var agentList = session.agents || [];
  var header = '<div class="session-meta">时间 '+escHtml(session.start_time || '')+' - '+escHtml(session.end_time || '')+'｜消息 '+fmtInt(session.message_count || (session.messages || []).length)+' 条｜来源 '+escHtml(session.source_log || '')+'</div>';
  var body = (session.messages || []).map(function(msg) {
    var speaker = msg.speaker || '';
    var isAgent = agentList.indexOf(speaker) >= 0;
    var cls = isAgent ? 'agent' : 'customer';
    return '<div class="chat-msg '+cls+'">'+
      '<div class="msg-meta"><strong>'+escHtml(speaker)+'</strong><span>'+escHtml(msg.time || '')+'</span></div>'+
      '<div class="msg-content">'+renderMessageContent(msg.content || '', speaker)+'</div>'+
    '</div>';
  }).join('');
  return header + '<div class="chat-list">'+body+'</div>';
}

function renderMessageContent(text, speaker) {
  var escaped = escHtml(text);
  var linked = escaped.replace(/(https?:\/\/[^\s<]+)/g, function(url) {
    return '<a href="'+url+'" target="_blank" rel="noopener">'+url+'</a>';
  });
  return linked + renderMediaCards(text, speaker);
}

var MEDIA_EXT = { img: ['jpg','jpeg','png','gif','webp','bmp','svg'], video: ['mp4','mov','webm','avi','mkv'] };
function extractMediaUrls(text) {
  if (!text) return [];
  var urls = text.match(/https?:\/\/[^\s<>"{}|\\^\[\]]+/gi) || [];
  var results = [], seen = {};
  urls.forEach(function(url) {
    var clean = url.replace(/[.,;:!?)>]+$/, '');
    if (seen[clean]) return;
    seen[clean] = true;
    var lower = clean.toLowerCase();
    for (var i = 0; i < MEDIA_EXT.img.length; i++) {
      var ie = MEDIA_EXT.img[i];
      if (lower.indexOf('.' + ie) > 0) { results.push({ url: clean, type: 'img', ext: ie }); return; }
    }
    for (var j = 0; j < MEDIA_EXT.video.length; j++) {
      var ve = MEDIA_EXT.video[j];
      if (lower.indexOf('.' + ve) > 0) { results.push({ url: clean, type: 'video', ext: ve }); return; }
    }
  });
  return results;
}

function renderMediaCards(text, speaker) {
  var medias = extractMediaUrls(text);
  if (!medias.length) return '';
  return '<div class="media-list">' + medias.map(function(media) {
    var id = 'm_' + Math.random().toString(36).slice(2);
    if (media.type === 'img') {
      return '<div class="media-card"><div class="media-label">图片预览 <span>'+media.ext.toUpperCase()+'</span></div><img id="'+id+'" src="'+media.url+'" loading="lazy" referrerpolicy="no-referrer" onclick="openLightbox(\''+media.url+'\')" onerror="mediaError(\''+id+'\',\''+media.url+'\',\'img\')" alt="聊天图片"><div class="media-actions"><a href="'+media.url+'" target="_blank" rel="noopener">打开原图</a></div></div>';
    }
    return '<div class="media-card video"><div class="media-label">视频预览 <span>'+media.ext.toUpperCase()+'</span></div><video id="'+id+'" controls preload="metadata" onerror="mediaError(\''+id+'\',\''+media.url+'\',\'video\')"><source src="'+media.url+'" type="video/'+(media.ext === 'mov' ? 'mp4' : media.ext)+'"></video><div class="media-actions"><a href="'+media.url+'" target="_blank" rel="noopener">打开视频</a></div></div>';
  }).join('') + '</div>';
}

function mediaError(id, url, type) {
  var el = document.getElementById(id);
  if (!el) return;
  var fallback = document.createElement('div');
  fallback.className = 'media-fallback';
  fallback.innerHTML = '<strong>'+ (type === 'img' ? '图片' : '视频') +'暂无法内嵌预览</strong><a href="'+url+'" target="_blank" rel="noopener">新窗口打开</a>';
  el.replaceWith(fallback);
}

function openLightbox(url) {
  var lb = document.getElementById('lightbox');
  if (!lb) {
    lb = document.createElement('div');
    lb.id = 'lightbox';
    lb.className = 'lightbox-overlay';
    lb.innerHTML = '<button onclick="closeLightbox()">关闭</button><img src="" alt="图片预览">';
    lb.addEventListener('click', function(e) { if (e.target === lb) closeLightbox(); });
    document.body.appendChild(lb);
  }
  lb.querySelector('img').src = url;
  lb.classList.add('show');
}

function closeLightbox() {
  var lb = document.getElementById('lightbox');
  if (lb) lb.classList.remove('show');
}

function displayValue(value, suffix) {
  if (value === null || value === undefined || value === '') return '-';
  if (typeof value === 'number') return value.toLocaleString('zh-CN', { maximumFractionDigits: 2 }) + (suffix || '');
  return escHtml(value);
}

function fmtInt(value) {
  var n = num(value);
  return n.toLocaleString('zh-CN', { maximumFractionDigits: 0 });
}

function escHtml(value) {
  return String(value === null || value === undefined ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function escJs(value) {
  return String(value || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
}

</script>
